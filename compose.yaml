services:
  chess-coach:
    build: .
    image: chess-coach:local
    container_name: chess-coach
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CHESS_COACH_PORT:-9123}:8000"
      - "${CHESS_COACH_LAN_BIND:-127.0.0.2}:${CHESS_COACH_PORT:-9123}:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: akashml
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
      LLM_MODEL_QUICK: ${LLM_MODEL_QUICK:-}
      LLM_MODEL_DEEP: ${LLM_MODEL_DEEP:-}
      MAIA_API_URL: http://maia:8001/move
      TZ: ${TZ:-America/Los_Angeles}
    depends_on:
      maia:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  maia:
    build:
      context: .
      dockerfile: Dockerfile.maia
    image: chess-coach-maia:local
    container_name: chess-coach-maia
    restart: unless-stopped
    init: true
    environment:
      MAIA_MODEL: maia3-5m
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
